<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a2118" />
    <title>Vạn Thắng — Ten Thousand Victories</title>
    <!-- The drum, from `node scripts/build-icon.mjs`. Every href is relative: the game is served
         from a repository sub-path on GitHub Pages, where a leading slash points at nothing.
         The tab marks are transparent and the install icons are not — `favicon.svg` is the disc on
         nothing, while `icon.svg` and the touch icons keep their sheet of paper, because iOS fills
         an icon's alpha with black. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vạn Thắng" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Self-hosted so the game's Vietnamese renders the same on every device, and so an
         offline load never falls back to whatever the phone happened to have. -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./fonts/BeVietnamPro-400-vietnamese.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./fonts/SourceSerif4-700-vietnamese.woff2" />
    <style>
      html,
      body,
      #game-root {
        width: 100%;
        /* `100%` on iOS resolves against the LARGE viewport, so the canvas is laid out for a
           height the page does not actually have while Safari's toolbars are showing, and Phaser
           fits the game into the wrong box. `dvh` tracks the visible viewport instead. */
        height: 100vh;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #201a12;
        touch-action: none;
        overscroll-behavior: none;
        font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        /* Vietnamese stacks two marks above the letter; anything tighter clips them. */
        line-height: 1.45;
      }

      canvas {
        display: block;
        image-rendering: auto;
      }

      /* Keeps the action bar clear of the home indicator on a notched phone. */
      #game-root {
        padding-bottom: env(safe-area-inset-bottom, 0);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
