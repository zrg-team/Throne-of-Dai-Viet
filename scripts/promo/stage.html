<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vạn Thắng — promo stage</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html, body { margin: 0; padding: 0; background: #2a2118; overflow: hidden; }
      /* The canvas is the frame. The driver sizes the viewport to match it exactly and then
         screenshots the page, so anything else visible here would be in the film. */
      #stage { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/scripts/promo/stage.ts"></script>
  </body>
</html>
