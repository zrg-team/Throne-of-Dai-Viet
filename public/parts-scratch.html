<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#e8ddc4;font:12px sans-serif">
<div id="g" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px"></div>
<script>
const keys=['hat-helm-dinh','hat-helm','hat-helm-leather','guard-beastmask','guard-shoulder',
'robe-armour-fanscale','robe-armour-scale','collar-band-brocade','collar-band-oxblood','collar-placket-square',
'belt-rope-coil','belt-gold','knot-nape','bun-tall-fore','bun-high','hairpin-plain','topknot-tall'];
document.getElementById('g').innerHTML=keys.map(k=>
`<div style="text-align:center"><div style="background:#cfc3a4;height:150px;display:flex;align-items:center;justify-content:center">
<img src="/faces/${k}.svg" style="max-width:100%;max-height:150px;image-rendering:auto"></div><div>${k}</div></div>`).join('');
</script>
