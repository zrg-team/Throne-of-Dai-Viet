name: TMP retry pattern check

on:
  workflow_dispatch:

jobs:
  # Mirrors the deploy job's retry chain exactly, with a step that fails once then succeeds,
  # so the outcome-guard conditions and the `||` output chain are exercised for real.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt 1 of 3 (forced failure)
        id: deploy_1
        continue-on-error: true
        run: |
          echo "attempt 1 running"
          exit 1

      - name: Back off before attempt 2
        if: steps.deploy_1.outcome == 'failure'
        run: |
          echo "backoff 2 ran"
          sleep 2

      - name: Attempt 2 of 3 (succeeds)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        run: echo "page_url=https://from-attempt-2.invalid/" >> "$GITHUB_OUTPUT"

      - name: Back off before attempt 3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: |
          echo "backoff 3 ran -- SHOULD NOT HAPPEN"
          sleep 2

      - name: Attempt 3 of 3
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: echo "attempt 3 ran -- SHOULD NOT HAPPEN"

      - name: Assert the chain behaved
        run: |
          echo "outcomes: 1=${{ steps.deploy_1.outcome }} 2=${{ steps.deploy_2.outcome }} 3=${{ steps.deploy_3.outcome }}"
          echo "url chain resolved to: '${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}'"
          test "${{ steps.deploy_1.outcome }}" = "failure"  || { echo "FAIL: attempt 1 outcome"; exit 1; }
          test "${{ steps.deploy_2.outcome }}" = "success"  || { echo "FAIL: attempt 2 did not run/succeed"; exit 1; }
          test "${{ steps.deploy_3.outcome }}" = "skipped"  || { echo "FAIL: attempt 3 should be skipped"; exit 1; }
          test "${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}" = "https://from-attempt-2.invalid/" \
            || { echo "FAIL: url chain did not fall through to attempt 2"; exit 1; }
          echo "OK: failed attempt is absorbed, next attempt runs, later attempt skipped, url falls through"

      - name: Assert job is not failed by the absorbed failure
        run: echo "job still running after a continue-on-error failure => job conclusion will be success"
